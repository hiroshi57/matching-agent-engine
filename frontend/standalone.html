<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>実スコアリング版</b>：希望条件を入力すると、<b>在庫データに対して実際に条件照合・重み付けスコア計算</b>を行い、適合理由と不足点を提示します。<b>物件データはこのツール内の架空サンプル6件</b>（実在物件ではありません／実運用では自社DBに接続）。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
// サンプル在庫(実運用ではDB接続)。実在物件のみを返す設計＝存在しない候補は生成しない
const STOCK=[
  {id:"RE-001", name:"新宿1K・駅徒歩5分", area:"新宿", layout:"1K",   rent:9.8,  walk:5,  age:8,  pets:false, autolock:true},
  {id:"RE-002", name:"新宿1LDK・築浅",   area:"新宿", layout:"1LDK", rent:14.5, walk:9,  age:3,  pets:false, autolock:true},
  {id:"RE-003", name:"渋谷1K・格安",     area:"渋谷", layout:"1K",   rent:8.9,  walk:12, age:22, pets:false, autolock:false},
  {id:"RE-004", name:"新宿1K・ペット可", area:"新宿", layout:"1K",   rent:11.2, walk:8,  age:12, pets:true,  autolock:true},
  {id:"RE-005", name:"渋谷1LDK・タワー", area:"渋谷", layout:"1LDK", rent:19.0, walk:4,  age:5,  pets:true,  autolock:true},
  {id:"RE-006", name:"池袋1K・広め",     area:"池袋", layout:"1K",   rent:9.2,  walk:7,  age:15, pets:false, autolock:false},
];
const AREAS=["新宿","渋谷","池袋"], LAYOUTS=["1K","1LDK","2LDK"];
// 重み(合計100)：条件ごとの重要度
const W={area:30, layout:25, rent:20, walk:15, pets:5, autolock:5};
const AXIS=["エリア","間取り","家賃","駅近","ペット可","設備"];

function scoreOne(p,q){
  const d=[];
  d.push({k:"エリア",  s:p.area===q.area?W.area:0, max:W.area, ok:p.area===q.area, why:p.area===q.area?"希望エリア「"+q.area+"」に一致":"エリアが「"+p.area+"」で希望外"});
  d.push({k:"間取り",  s:p.layout===q.layout?W.layout:0, max:W.layout, ok:p.layout===q.layout, why:p.layout===q.layout?"間取り「"+q.layout+"」に一致":"間取りが「"+p.layout+"」で希望外"});
  const over=p.rent-q.rentMax;
  const rentS=over<=0?W.rent:Math.max(0,W.rent-Math.round(over*6));
  d.push({k:"家賃", s:rentS, max:W.rent, ok:over<=0, why:over<=0?"予算内（"+p.rent+"万円 ≤ "+q.rentMax+"万円）":"予算を"+over.toFixed(1)+"万円超過"});
  const wover=p.walk-q.walkMax;
  const walkS=wover<=0?W.walk:Math.max(0,W.walk-wover*2);
  d.push({k:"駅近", s:walkS, max:W.walk, ok:wover<=0, why:wover<=0?"徒歩"+p.walk+"分（希望"+q.walkMax+"分以内）":"徒歩"+p.walk+"分で希望より"+wover+"分遠い"});
  const petOk=!q.pets||p.pets;
  d.push({k:"ペット可", s:petOk?W.pets:0, max:W.pets, ok:petOk, why:!q.pets?"条件指定なし":(p.pets?"ペット可":"ペット不可")});
  const alOk=!q.autolock||p.autolock;
  d.push({k:"設備", s:alOk?W.autolock:0, max:W.autolock, ok:alOk, why:!q.autolock?"条件指定なし":(p.autolock?"オートロックあり":"オートロックなし")});
  const total=d.reduce((a,x)=>a+x.s,0);
  return {...p, d, total};
}
const color=v=>v>=75?"#17a673":v>=55?"#f0a500":"#e0533b";
function level(t){return t>=85?["ほぼ理想","#0f7a54"]:t>=70?["好条件","#17a673"]:t>=50?["妥協点あり","#f0a500"]:["条件不一致","#e0533b"];}

function Radar({own}){
  const cx=150,cy=145,R=100,N=own.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*R*r, cy+Math.sin(ang(i))*R*r];
  const poly=arr=>arr.map((v,i)=>pt(i,Math.max(0,Math.min(1,v))).join(",")).join(" ");
  return (<svg width="100%" viewBox="0 0 300 300" style={{maxWidth:340}}>
    {[0.33,0.66,1].map((rr,k)=>(<polygon key={k} points={own.map((_,i)=>pt(i,rr).join(",")).join(" ")} fill="none" stroke="#ece4dc"/>))}
    {own.map((_,i)=>{const[x,y]=pt(i,1);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#ece4dc"/>;})}
    <polygon points={poly(own.map(()=>1))} fill="none" stroke="#c9b8a8" strokeWidth="1.5" strokeDasharray="4 3"/>
    <polygon points={poly(own)} fill="#e07b3933" stroke="#e07b39" strokeWidth="2.5"/>
    {AXIS.map((a,i)=>{const[x,y]=pt(i,1.18);return <text key={i} x={x} y={y} textAnchor="middle" fontSize="9.5" fill="#556">{a}</text>;})}
  </svg>);
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="matching_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [q,setQ]=usePersist("q",{area:"新宿",layout:"1K",rentMax:10,walkMax:8,pets:false,autolock:true});
  const [ran,setRan]=React.useState(false);
  const [sel,setSel]=React.useState(0);
  const set=(k,v)=>{setQ(x=>({...x,[k]:v}));};
  const results=STOCK.map(p=>scoreOne(p,q)).sort((a,b)=>b.total-a.total);
  const hit=results.filter(r=>r.total>=50);
  const best=results[Math.min(sel,results.length-1)];
  const [lvl,lvlc]=best?level(best.total):["",""];
  const own=best?best.d.map(x=>x.s/x.max):[];
  const missing=best?best.d.filter(x=>!x.ok):[];
  // 条件の緩和シミュレーション: 各条件を1つ緩めたら何件増えるか
  const relax=[
    {k:"エリアを問わない", q2:{...q,area:"__any"}},
    {k:"家賃上限+2万円",   q2:{...q,rentMax:q.rentMax+2}},
    {k:"駅徒歩+5分まで",   q2:{...q,walkMax:q.walkMax+5}},
    {k:"間取りを問わない", q2:{...q,layout:"__any"}},
  ].map(r=>{
    const cnt=STOCK.map(p=>{
      const qq={...r.q2};
      const pp={...p};
      if(qq.area==="__any")qq.area=pp.area;
      if(qq.layout==="__any")qq.layout=pp.layout;
      return scoreOne(pp,qq);
    }).filter(x=>x.total>=70).length;
    return {...r,cnt};
  });
  const base=results.filter(r=>r.total>=70).length;

  return (<div className="wrap"><DataBar/>
    <h1>賃貸物件マッチング <span className="sub">希望条件から、在庫にある物件だけを点数化して提案</span></h1>

    <div className="card" style={{background:"#fffdf8"}}>
      <h2>このツールは何？（3行で）</h2>
      <div style={{fontSize:13,lineHeight:1.8}}>
        <div>▪️ <b>誰向け</b>：賃貸仲介の営業担当・不動産ポータル運営者。お客様の「ざっくりした希望」を条件に落として物件を絞る仕事をしている人。</div>
        <div>▪️ <b>何が違う</b>：AIが物件を<b>創作しません</b>。在庫データに<b>実在する物件だけ</b>を、条件との一致度で点数化します。</div>
        <div>▪️ <b>使いどころ</b>：①接客中に条件を入れて候補を出す ②候補ゼロの時に「どの条件を緩めれば何件増えるか」を即答する ③候補ゼロ条件を集めて<b>仕入れ・広告</b>に活かす。</div>
      </div>
      <div className="sub" style={{marginTop:8}}>※このエンジン自体は業種を差し替えられる設計（求人・中古車など）ですが、この画面は<b>賃貸不動産</b>の例です。</div>
    </div>

    <div className="card">
      <div className="real">✏️ <b>希望条件を入力</b>して「候補を探す」。在庫{STOCK.length}件それぞれと条件を照合し、重み付け（エリア30/間取り25/家賃20/駅近15/ペット5/設備5）でスコア化します。<b>存在しない物件は作りません。</b></div>
      <div className="src">
        <b>📋 このデータの出所（正直に）</b>
        <div>・下の物件{STOCK.length}件は<b>このツールに書かれた架空のサンプルデータ</b>です。実在の物件情報や外部サイトからの取得データではありません（下の「在庫データを見る」で全件確認できます）。</div>
        <div>・<b>スコアは架空データに対する実計算</b>です（条件照合＋重み付けを実行しています。数値をあらかじめ書いてあるのではありません）。</div>
        <div>・重み（エリア30/間取り25/家賃20/駅近15/ペット5/設備5）は<b>当社が設定した仮の重要度</b>です。公的調査に基づく値ではありません。実運用では自社の成約実績から算出します。</div>
        <div>・<b>実運用時</b>：ここを自社の物件DB（またはREINS/自社CMS等）に接続すると、実在庫に対して同じ計算が動きます。</div>
      </div>
      <div className="form">
        <div><label>エリア</label><select value={q.area} onChange={e=>set("area",e.target.value)}>{AREAS.map(a=>(<option key={a}>{a}</option>))}</select></div>
        <div><label>間取り</label><select value={q.layout} onChange={e=>set("layout",e.target.value)}>{LAYOUTS.map(a=>(<option key={a}>{a}</option>))}</select></div>
        <div><label>家賃上限(万円)</label><input type="number" step="0.5" value={q.rentMax} onChange={e=>set("rentMax",Number(e.target.value)||0)}/></div>
        <div><label>駅徒歩(分以内)</label><input type="number" value={q.walkMax} onChange={e=>set("walkMax",Number(e.target.value)||0)}/></div>
        <div><label>ペット可が必要</label><select value={q.pets?"必要":"不問"} onChange={e=>set("pets",e.target.value==="必要")}><option>不問</option><option>必要</option></select></div>
        <div><label>オートロック必要</label><select value={q.autolock?"必要":"不問"} onChange={e=>set("autolock",e.target.value==="必要")}><option>不問</option><option>必要</option></select></div>
      </div>
      <button className="primary" onClick={()=>{setRan(true);setSel(0);}}>候補を探す</button>
      <button className="ghost" onClick={()=>{setQ({area:"新宿",layout:"3LDK",rentMax:8,walkMax:3,pets:true,autolock:true});setRan(true);setSel(0);}}>候補ゼロの例</button>
    </div>

    {ran && <React.Fragment>
      {hit.length===0
        ? <div className="card"><div className="zero"><b>該当なし</b>：この条件に合う在庫はありません（無理に似た物件を提示しません）。下の「条件を緩めた場合」を参考に条件を調整してください。</div></div>
        : <div className="card">
            <h2>候補一覧（適合スコア順・実在{hit.length}件）</h2>
            <table><thead><tr><th className="l">物件</th><th>エリア</th><th>間取り</th><th>家賃</th><th>徒歩</th><th>適合スコア</th></tr></thead>
              <tbody>{results.map((r,i)=>(<tr key={r.id} className={"clk"+(i===sel?" sel":"")} onClick={()=>setSel(i)}>
                <td className="l"><b>{r.name}</b><br/><span className="sub">{r.id}</span></td>
                <td>{r.area}</td><td>{r.layout}</td><td>{r.rent}万</td><td>{r.walk}分</td>
                <td style={{color:color(r.total),fontWeight:"bold"}}>{r.total}</td></tr>))}
              </tbody></table>
            <p className="sub">※スコア50未満も参考表示していますが、条件不一致です。</p>
          </div>}

      {best && <div className="card" style={{display:"flex",gap:24,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{textAlign:"center"}}>
          <h2>{best.name}</h2>
          <div className="big" style={{color:color(best.total)}}>{best.total}<span style={{fontSize:16,color:"#8a8f9c"}}> /100</span></div>
          <span className="lvl" style={{background:lvlc}}>{lvl}</span>
          <div className="sub" style={{marginTop:6}}>{best.id} ／ {best.rent}万円・徒歩{best.walk}分・築{best.age}年</div>
        </div>
        <div><Radar own={own}/><div className="sub" style={{textAlign:"center"}}>■この物件の各条件充足度（外周=満点）</div></div>
      </div>}

      {best && <div className="card">
        <h2>なぜこの物件か（条件ごとの根拠）</h2>
        {best.d.map((x,i)=>(<div className="barrow" key={i}>
          <span className="name">{x.k}</span>
          <div className="track"><div className="fill" style={{width:(x.s/x.max*100)+"%",background:x.ok?"#17a673":"#e0533b"}}></div></div>
          <span style={{width:52,textAlign:"right"}}>{x.s}/{x.max}</span>
          <span className={x.ok?"reason":"miss"} style={{flex:1}}>{x.ok?"✓ ":"✗ "}{x.why}</span>
        </div>))}
      </div>}

      <div className="card">
        <h2>🤖 成約に近づけるプラン</h2>
        <div className="ai">
          現在の条件で<b>スコア70以上の候補は {base}件</b>です。
          {best && missing.length>0 && <span> 最有力「{best.name}」で満たせていないのは <b>{missing.map(m=>m.k).join("・")}</b> です。</span>}
          {base===0 && <span> このままでは決めにくい状態です。下記のどれか1つを緩めるのが近道です。</span>}
        </div>
        <div className="plan">
          <div className="tierlabel">① まず1つ緩める（緩和で増える候補数を実計算）</div>
          <ul>{relax.sort((a,b)=>b.cnt-a.cnt).map((r,k)=>(<li key={k}>
            <b>{r.k}</b> → 候補 <b>{base}件 → {r.cnt}件</b>（{r.cnt>base?<span style={{color:"#0f7a54",fontWeight:"bold"}}>+{r.cnt-base}件</span>:<span style={{color:"#8a8f9c"}}>変化なし</span>}）
          </li>))}</ul>
        </div>
        <div className="plan">
          <div className="tierlabel">② さらに条件を詰める（広告・仕入れへの示唆）</div>
          <ul>
            <li><b>候補ゼロの条件は「仕入れ機会」</b>：需要はあるのに在庫がない＝獲得すべき物件像。</li>
            <li><b>頻出条件は広告キーワード候補</b>：この検索では「{q.area}」「{q.layout}」「家賃{q.rentMax}万以下」が主要ニーズ。</li>
            <li>緩和で最も候補が増える「{[...relax].sort((a,b)=>b.cnt-a.cnt)[0].k}」を接客トークの一次提案に。</li>
          </ul>
        </div>
      </div>
    </React.Fragment>}

    <div className="card">
      <h2>参照している在庫データ（全{STOCK.length}件）</h2>
      <p className="sub">検索は<b>この一覧だけ</b>を対象にしています。ここに無い物件は絶対に出てきません（AIが創作しない設計）。</p>
      <table><thead><tr><th className="l">ID</th><th className="l">物件名</th><th>エリア</th><th>間取り</th><th>家賃</th><th>徒歩</th><th>築年</th><th>ペット</th><th>オートロック</th></tr></thead>
        <tbody>{STOCK.map(p=>(<tr key={p.id}>
          <td className="l">{p.id}</td><td className="l">{p.name}</td><td>{p.area}</td><td>{p.layout}</td>
          <td>{p.rent}万</td><td>{p.walk}分</td><td>{p.age}年</td><td>{p.pets?"可":"不可"}</td><td>{p.autolock?"有":"無"}</td></tr>))}
        </tbody></table>
      <div className="src" style={{marginTop:8}}>この6件は<b>デモ用に作成した架空データ</b>です。実在物件・外部サイトのデータではありません。実運用では自社物件DBに差し替えます。</div>
    </div>

    <p className="note">※スコアは入力条件と在庫データの実照合による計算結果です。重み(30/25/20/15/5/5)は業種ヒューリスティックで、実運用では成約実績から学習して調整します。在庫はサンプル{STOCK.length}件（実運用は自社DB接続）。存在しない物件をAIが創作しない設計です。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}
function Footer(){
  return (<div className="wrap" style={{margin:"24px auto 8px",fontSize:11.5,color:"#8a8f9c",lineHeight:1.9,
      borderTop:"1px solid #e0e6ec",paddingTop:12}}>
    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>
    <div><b style={{color:"#556"}}>データの取り扱い</b>：入力された内容は<b>お使いの端末の中だけ</b>に保存されます。当社のサーバーへ送信・保存されることはありません。端末を共有している場合は、画面上の「最初に戻す」で消去してください。</div>
    <div><b style={{color:"#556"}}>ご利用にあたって</b>：本ツールの計算結果は<b>判断の材料</b>であり、成果を保証するものではありません。最終的な意思決定はご自身の責任で行ってください。本ツールの利用により生じた損害について、当社は責任を負いかねます。</div>

}

// ===== サーバー保管・複数人共有 =====
const API="https://di-tools-api.vercel.app/api/workspace";
function qs(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
function ShareBar(){
  const [busy,setBusy]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [info,setInfo]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":__share");return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [who,setWho]=React.useState(function(){
    try{return localStorage.getItem("di_who")||"";}catch(e){return "";}
  });
  const [loaded,setLoaded]=React.useState(null);
  const [title,setTitle]=React.useState("");

  // 共有リンクで開かれた場合はサーバーから読み込む
  React.useEffect(function(){
    var id=qs("ws"); if(!id)return;
    var key=qs("key");
    setBusy(true);
    fetch(API+"?id="+encodeURIComponent(id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg("読み込めませんでした: "+j.error);setBusy(false);return;}
        Object.keys(j.data||{}).forEach(function(k){
          localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));
        });
        if(key)localStorage.setItem(STORE+":__share",JSON.stringify({id:id,editKey:key}));
        setLoaded({title:j.title,updatedBy:j.updatedBy,updatedAt:j.updatedAt,canEdit:!!key});
        // 取り込んだ内容を反映するため再読込（?ws= は外す）
        if(!sessionStorage.getItem("di_loaded_"+id)){
          sessionStorage.setItem("di_loaded_"+id,"1");
          location.replace(location.pathname);
        }
        setBusy(false);
      })
      .catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  },[]);

  const remember=function(v){setWho(v);try{localStorage.setItem("di_who",v);}catch(e){}};
  const body=function(){
    return {tool:STORE, title:title||document.title, who:who,
      data:(typeof collectAll==="function"?collectAll():{})};
  };
  const create=function(){
    setBusy(true);setMsg("");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        var nx={id:j.id,editKey:j.editKey};
        localStorage.setItem(STORE+":__share",JSON.stringify(nx));
        setInfo(nx);setMsg("サーバーに保存しました");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const update=function(){
    if(!info)return create();
    setBusy(true);setMsg("");
    fetch(API+"?id="+info.id+"&key="+info.editKey,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        setMsg("サーバーに保存しました（"+new Date().toLocaleTimeString("ja-JP")+"）");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const linkView=info?(location.origin+location.pathname+"?ws="+info.id):"";
  const linkEdit=info?(linkView+"&key="+info.editKey):"";
  const copy=function(t,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){setMsg(label+"をコピーしました");
        setTimeout(function(){setMsg("");},3000);});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setMsg(label+"をコピーしました");}catch(e){}
      document.body.removeChild(ta);
    }
  };
  const bs={border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontSize:12.5};
  return (<div className="noprint" style={{background:"#eef4fb",border:"1px solid #c5d8f5",borderRadius:10,
      padding:"10px 12px",margin:"0 0 12px",fontSize:13,color:"#1a4d8f"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span>☁️ <b>サーバーに保存して、チームで共有できます</b></span>
      <span style={{flex:1}}></span>
      <input value={who} onChange={function(e){remember(e.target.value);}} placeholder="お名前（任意）"
        style={{border:"1px solid #b9cbe4",borderRadius:6,padding:"6px 8px",fontSize:12.5,width:120}}/>
      {!info && <button onClick={create} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"サーバーに保存"}</button>}
      {info && <button onClick={update} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"変更を保存"}</button>}
    </div>
    {loaded && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px"}}>
      📥 共有リンクから読み込みました{loaded.updatedBy?"（最終更新: "+loaded.updatedBy+"）":""}。
      {loaded.canEdit?"このリンクは編集できます。":"このリンクは閲覧専用です（変更しても他の人には反映されません）。"}
    </div>}
    {info && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px",lineHeight:2}}>
      <div><b>閲覧用リンク</b>（見るだけ）
        <button onClick={function(){copy(linkView,"閲覧用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkView}</div></div>
      <div style={{marginTop:6}}><b>編集用リンク</b>（変更もできる／取扱注意）
        <button onClick={function(){copy(linkEdit,"編集用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkEdit}</div></div>
    </div>}
    {msg && <div style={{marginTop:6,fontWeight:"bold"}}>{msg}</div>}
    <div style={{marginTop:6,fontSize:11.5,color:"#5b7fb0"}}>
      ※「サーバーに保存」を押したときだけ送信されます。押さなければ、これまで通り端末内だけで処理されます。
    </div>
  </div>);
}
